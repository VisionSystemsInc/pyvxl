version: 2.1
jobs:
  build:
    docker:
      - image: vsiri/vxl:latest
    working_directory: /source
    steps:

      - run:
          name: Setup
          command: |

            # clear the way
            mkdir -p /source/vxl /source/pyvxl /build /venv

            # install uv
            export UV_INSTALL_DIR="/usr/local/bin"
            curl -LsSf https://astral.sh/uv/0.13.1/install.sh | sh

            # create & activate venv
            uv venv /venv --python 3.13.16
            source /venv/bin/activate

            # dependencies
            uv pip install "cmake==3.27" ninja pybind11 numpy

            # add virtualenv to .bashrc to automatically activate
            # for every following step
            echo "source /venv/bin/activate" >> $BASH_ENV

            # report
            set -x
            type -a python3
            python3 --version
            python3 -m site
            uv pip freeze

      - run:
          name: Checkout VXL
          command: |

            # clone vxl, optionally checkout specific version, report
            VXL_DIR="/source/vxl"
            git clone -b "${VXL_VERSION:-master}" \
                https://github.com/vxl/vxl.git "${VXL_DIR}"
            echo "git describe vxl = $(git -C "${VXL_DIR}" describe --tags HEAD --always)"

      - checkout:
          path: /source/pyvxl

      - run:
          name: configure
          working_directory: /build
          command: |

            # python & pybind11
            python_exe="/venv/bin/python"
            pybind11_DIR="$("${python_exe}" -c "import pybind11; print(pybind11.get_cmake_dir())")"

            # configure
            OPTS=(
              -S /source/pyvxl
              -B /build
              -G Ninja
              -D CMAKE_BUILD_TYPE=Release
              -D Python_EXECUTABLE="${python_exe}"
              -D pybind11_DIR="${pybind11_DIR}"
              -D VXL_SOURCE_DIR="/source/vxl"
              -D PYVXL_CONTRIB_MAKE_ALL=ON
              -D PYVXL_DEBUG_MESSAGES=ON
              -D VXL_BUILD_CORE_VIDEO=ON
              -D VXL_BUILD_CONTRIB=ON
              -D VXL_BUILD_BRL=ON
            )
            uv run cmake "${OPTS[@]}"

      - run:
          name: compile
          working_directory: /build
          command: set -x && ninja -j${NINJA_JOBS:-$((`nproc` / 2))}

      - run:
          name: install
          working_directory: /build
          command: ninja install

      - run:
          name: test imports
          working_directory: /source/pyvxl
          command: ./test/test_import.bsh

      - run:
          name: test
          working_directory: /source/pyvxl
          command: python -m unittest discover -v test


workflows:
  version: 2
  commit:
    jobs:
      - build
  nightly:
    triggers:
      - schedule:
          cron: "0 0 * * *"
          filters:
            branches:
              only:
                - master
    jobs:
      - build
